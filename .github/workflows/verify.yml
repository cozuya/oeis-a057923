name: Verify Lean proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  public:

permissions:
  contents: read

jobs:
  verify:
    name: Exact statement and axiom check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility || 'unknown' }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the checksum-pinned Lean release
        shell: bash
        run: |
          set -euo pipefail
          lean_download_url=$(python3 -c 'import json; print(json.load(open("TOOLCHAIN.json"))["linux_x86_64"]["url"])')
          lean_archive_sha=$(python3 -c 'import json; print(json.load(open("TOOLCHAIN.json"))["linux_x86_64"]["sha256"])')
          lean_archive_dir=$(python3 -c 'import json; print(json.load(open("TOOLCHAIN.json"))["linux_x86_64"]["directory"])')
          lean_archive_path="$RUNNER_TEMP/lean.tar.zst"
          curl --fail --location --silent --show-error --retry 3 "$lean_download_url" -o "$lean_archive_path"
          printf '%s  %s\n' "$lean_archive_sha" "$lean_archive_path" | sha256sum --check -
          tar --zstd -xf "$lean_archive_path" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/$lean_archive_dir/bin" >> "$GITHUB_PATH"

      - name: Verify the proof and its exact statement
        run: python3 scripts/verify.py

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}-${{ github.run_id }}
          path: |
            .build/verification.json
            .build/verification.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
